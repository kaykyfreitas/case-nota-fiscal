# Tag `application` nas series do Prometheus e no JSON de log (`service.name` / logger).
spring.application.name=gerador-nota-fiscal
spring.mvc.problemdetails.enabled=true
spring.threads.virtual.enabled=true
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.write.write-bigdecimal-as-plain=true
# Por default o Actuator so expoe /health. Prometheus precisa ser listado; env/heapdump ficam fechados.
management.endpoints.web.exposure.include=health,prometheus
# Liga /actuator/health/liveness e /readiness mesmo fora do Kubernetes (demo local / entrevista).
management.endpoint.health.probes.enabled=true
# Uma linha JSON por evento (Boot nativo). MDC `requestId` vira campo no objeto; o pattern de texto nao aplica.
logging.structured.format.console=logstash
# DEBUG nas laterais mostra requestId na VT (MdcPropagacao). Desligado no default para nao explodir carga.
# logging.level.br.com.itau.geradornotafiscal.core.service.impl=DEBUG
