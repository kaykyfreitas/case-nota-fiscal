services:
  gerador-nf:
    build: .
    ports:
      - "8080:8080"
    mem_limit: 512m
    cpus: "0.50"
    environment:
      TZ: America/Sao_Paulo
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -Duser.timezone=America/Sao_Paulo"

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["metrics"]
    ports:
      - "9090:9090"
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      - gerador-nf

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["metrics"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
